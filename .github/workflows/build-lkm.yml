name: Build LKM for KernelSU
on:
  workflow_call:
    inputs:
      expected_size:
        description: 'Manager certificate size'
        required: false
        default: '0x0208'
        type: string
      expected_hash:
        description: 'Manager certificate SHA-256'
        required: false
        default: 'fb3cda80dfdac6c2e5d32d080e6c35b58e606f545cbb873aad3ba0bb79866462'
        type: string
      expected_size2:
        description: 'Second expected signature size (for PR builds)'
        required: false
        default: ''
        type: string
      expected_hash2:
        description: 'Second expected signature hash (for PR builds)'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      expected_size:
        description: 'Manager certificate size'
        required: false
        default: '0x0208'
        type: string
      expected_hash:
        description: 'Manager certificate SHA-256'
        required: false
        default: 'fb3cda80dfdac6c2e5d32d080e6c35b58e606f545cbb873aad3ba0bb79866462'
        type: string
jobs:
  build-lkm:
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      kmi: ${{ matrix.kmi }}
      expected_size: ${{ inputs.expected_size || '0x0208' }}
      expected_hash: ${{ inputs.expected_hash || 'fb3cda80dfdac6c2e5d32d080e6c35b58e606f545cbb873aad3ba0bb79866462' }}
      expected_size2: ${{ inputs.expected_size2 || '' }}
      expected_hash2: ${{ inputs.expected_hash2 || '' }}
